name: Dependency remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Upgrade patched Next.js
        run: npm install next@16.3.1 --save-exact
      - name: Apply compatible transitive security fixes
        run: npm audit fix
      - name: Require no high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Commit deterministic dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): remediate npm dependency vulnerabilities"
          git push origin HEAD:main
