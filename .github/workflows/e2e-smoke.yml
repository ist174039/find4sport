name: E2E Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: e2e-smoke-production
  cancel-in-progress: true

jobs:
  production-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for healthy production endpoint
        env:
          E2E_HEALTH_URL: https://find4sport.vercel.app/api/health
        run: |
          for attempt in {1..12}; do
            status=$(curl -sS -o health.json -w '%{http_code}' "$E2E_HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Production healthcheck is healthy"
              cat health.json
              exit 0
            fi
            echo "Attempt $attempt: healthcheck returned HTTP $status"
            cat health.json 2>/dev/null || true
            sleep 10
          done
          echo "Production healthcheck did not become healthy"
          exit 1

      - name: Require authenticated E2E coverage
        env:
          E2E_ATHLETE_EMAIL: ${{ secrets.E2E_ATHLETE_EMAIL }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}
          E2E_PROFESSIONAL_EMAIL: ${{ secrets.E2E_PROFESSIONAL_EMAIL }}
          E2E_PROFESSIONAL_PASSWORD: ${{ secrets.E2E_PROFESSIONAL_PASSWORD }}
          E2E_VENUE_MANAGER_EMAIL: ${{ secrets.E2E_VENUE_MANAGER_EMAIL }}
          E2E_VENUE_MANAGER_PASSWORD: ${{ secrets.E2E_VENUE_MANAGER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          echo "## Authenticated E2E coverage" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for role in ATHLETE PROFESSIONAL VENUE_MANAGER ADMIN; do
            email_var="E2E_${role}_EMAIL"
            password_var="E2E_${role}_PASSWORD"
            if [ -n "${!email_var}" ] && [ -n "${!password_var}" ]; then
              echo "- ✅ ${role}: configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ ${role}: required GitHub secrets are missing" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Missing required authenticated E2E credentials for ${role}"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Authenticated production E2E is blocked until all four required role accounts are configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All 4/4 required authenticated roles are configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Report operational-admin E2E readiness
        env:
          E2E_OPERATIONAL_ADMIN_EMAIL: ${{ secrets.E2E_OPERATIONAL_ADMIN_EMAIL }}
          E2E_OPERATIONAL_ADMIN_PASSWORD: ${{ secrets.E2E_OPERATIONAL_ADMIN_PASSWORD }}
        run: |
          if [ -n "$E2E_OPERATIONAL_ADMIN_EMAIL" ] && [ -n "$E2E_OPERATIONAL_ADMIN_PASSWORD" ]; then
            echo "- ✅ OPERATIONAL_ADMIN: configured; negative General-only browser checks enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ OPERATIONAL_ADMIN: not configured; General-only browser denial remains covered only below E2E level" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run production smoke suite
        env:
          E2E_BASE_URL: https://find4sport.vercel.app
          E2E_ATHLETE_EMAIL: ${{ secrets.E2E_ATHLETE_EMAIL }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}
          E2E_PROFESSIONAL_EMAIL: ${{ secrets.E2E_PROFESSIONAL_EMAIL }}
          E2E_PROFESSIONAL_PASSWORD: ${{ secrets.E2E_PROFESSIONAL_PASSWORD }}
          E2E_VENUE_MANAGER_EMAIL: ${{ secrets.E2E_VENUE_MANAGER_EMAIL }}
          E2E_VENUE_MANAGER_PASSWORD: ${{ secrets.E2E_VENUE_MANAGER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OPERATIONAL_ADMIN_EMAIL: ${{ secrets.E2E_OPERATIONAL_ADMIN_EMAIL }}
          E2E_OPERATIONAL_ADMIN_PASSWORD: ${{ secrets.E2E_OPERATIONAL_ADMIN_PASSWORD }}
        run: npx playwright test e2e/public-smoke.spec.mjs e2e/authenticated-smoke.spec.mjs --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
