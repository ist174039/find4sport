name: Isolated Playwright E2E

# Candidate Next.js runs with a loopback-only synthetic Supabase fixture.
# No production credentials, privileged service tokens or real user records.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9876
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-only-no-real-access
      SUPABASE_SERVICE_ROLE_KEY: synthetic-admin-only-no-real-access
      E2E_BASE_URL: http://127.0.0.1:8081
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start synthetic Supabase and candidate Next.js
        shell: bash
        run: |
          set -euo pipefail
          node scripts/e2e-mock-supabase.mjs > /tmp/f4s-mock.log 2>&1 &
          echo $! > /tmp/f4s-mock.pid
          npx next dev --webpack -H 127.0.0.1 -p 8081 > /tmp/f4s-next.log 2>&1 &
          echo $! > /tmp/f4s-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:9876/_fixture/health >/dev/null \
              && curl --fail --silent --max-time 15 http://127.0.0.1:8081/api/health >/tmp/f4s-health.json; then
              node -e 'const d=require("/tmp/f4s-health.json");if(d.status!=="ok"||d.checks.database!=="ok")process.exit(1)'
              echo "Synthetic Next.js is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Candidate app failed startup in isolated test environment."
          tail -n 70 /tmp/f4s-next.log || true
          exit 1
      - name: Playwright public UI and anonymous authorization
        run: npx playwright test e2e/synthetic-public-smoke.spec.mjs --project=${{ matrix.project }} --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: find4sport-isolated-playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Stop synthetic services
        if: always()
        run: |
          kill "$(cat /tmp/f4s-next.pid)" 2>/dev/null || true
          kill "$(cat /tmp/f4s-mock.pid)" 2>/dev/null || true
