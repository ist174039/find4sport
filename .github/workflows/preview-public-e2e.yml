name: Preview Public E2E

# Read-only/public browser validation of the candidate. Never run authenticated or
# financial mutations against a preview connected to non-isolated Supabase.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-public-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    env:
      E2E_BASE_URL: https://find4sport-git-feat-a130be-carlos-evaristo-silva-gomes-projects.vercel.app
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout candidate HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Require Vercel preview of this exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            response=$(curl --fail --location --silent --show-error --max-time 15 "$E2E_BASE_URL/api/health" || true)
            if [ -n "$response" ]; then
              observed=$(node -e 'try { process.stdout.write(JSON.parse(process.argv[1]).version || "") } catch {}' "$response")
              if [ "$observed" = "$EXPECTED_SHA" ]; then
                echo "Verified preview commit: $observed"
                exit 0
              fi
              echo "Attempt $attempt: preview SHA does not match this PR HEAD"
            else
              echo "Attempt $attempt: candidate preview not accessible"
            fi
            sleep 10
          done
          echo "::error::No public Vercel preview with exact expected SHA. Refusing stale preview evidence."
          exit 1
      - name: Execute public discovery and anonymous authorization E2E
        run: npx playwright test e2e/public-smoke.spec.mjs e2e/search-pagination.spec.mjs --project=${{ matrix.project }} --workers=1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: find4sport-preview-public-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
