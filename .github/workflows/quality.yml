name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PUBLIC_DISCOVERY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PUBLIC_DISCOVERY_TEST_ALLOW_DESTRUCTIVE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Migration repository integrity (does not establish release readiness)
        id: migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-migrations.mjs

      - name: Dependency audit
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=low

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Automated tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Public discovery PostgreSQL contract
        id: postgres_contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:postgres:discovery

      - name: Profile table least privilege contract
        id: profile_grants_contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:postgres:profile-grants

      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Publish quality evidence
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          MIGRATION_RESULT: ${{ steps.migrations.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.types.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          POSTGRES_CONTRACT_RESULT: ${{ steps.postgres_contract.outcome }}
          PROFILE_GRANTS_RESULT: ${{ steps.profile_grants_contract.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Quality evidence"
            echo "Commit: $COMMIT_SHA"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install | $INSTALL_RESULT |"
            echo "| Migrations | $MIGRATION_RESULT |"
            echo "| Dependency audit | $AUDIT_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Typecheck | $TYPECHECK_RESULT |"
            echo "| Tests | $TEST_RESULT |"
            echo "| PostgreSQL public discovery contract | $POSTGRES_CONTRACT_RESULT |"
            echo "| PostgreSQL profile grants contract | $PROFILE_GRANTS_RESULT |"
            echo "| Build | $BUILD_RESULT |"
            echo ""
            echo "Every required check must succeed. A failed check keeps Quality failed."
          } >> "$GITHUB_STEP_SUMMARY"
